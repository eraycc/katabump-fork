name: Katabump Auto Renew

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  renew:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        npm install
        npx playwright install-deps chrome

    - name: Run Renew Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node action_renew.js

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: screenshots/

    - name: Update action log
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        RUN_STATUS="${{ job.status }}"
        cat > action_cache.json << EOF
        {
          "last_run": "$(date -Iseconds)",
          "run_id": "${{ github.run_id }}",
          "run_number": "${{ github.run_number }}",
          "status": "$RUN_STATUS",
          "commit": "${{ github.sha }}",
          "trigger": "${{ github.event_name }}"
        }
        EOF

        git checkout action-log 2>/dev/null || git checkout -b action-log
        git pull origin action-log --rebase || true
        git add action_cache.json
        git commit -m "chore: update action log from run #${{ github.run_number }}" || echo "No changes to commit"
        git push origin action-log --force-with-lease
